<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestSpot · Komşu & Misafir Otopark Paylaşımı</title>
    <meta name="description" content="Site ve apartman sakinleri için tahsisli otopark paylaşım ve misafir izin platformu.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><circle cx='12' cy='12' r='10'/></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Minimal Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="parking-circle"></i>
                </div>
                <div class="brand-info">
                    <span class="brand-title">NestSpot</span>
                    <span class="brand-subtitle" data-i18n="brandSubtitle">Aura Park Evleri</span>
                </div>
            </div>

            <div class="header-search">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="spotSearchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Daire, sakin veya plaka ara (örn. A-01, Ahmet, 34)...">
            </div>

            <div class="header-actions">
                <!-- Language Switcher -->
                <div class="lang-switch">
                    <button class="lang-btn" id="langTrBtn" onclick="setLanguage('tr')">TR</button>
                    <button class="lang-btn" id="langEnBtn" onclick="setLanguage('en')">EN</button>
                </div>

                <!-- Gate Security Button -->
                <button class="btn-action-pill" id="securityGateBtn">
                    <i data-lucide="shield-check"></i>
                    <span data-i18n="securityGateBtn">Güvenlik Plaka Sorgu</span>
                </button>

                <!-- Active Passes Button -->
                <button class="btn-action-pill" id="activePassesBtn">
                    <i data-lucide="ticket"></i>
                    <span data-i18n="myActiveBookings">Aktif İzinler</span>
                </button>

                <!-- Live Summary Pill -->
                <div class="site-badge">
                    <span class="live-dot"></span>
                    <span id="spotsAvailableSummary">--</span>
                </div>

                <div class="profile-chip">
                    <span class="profile-avatar">AY</span>
                    <span class="profile-name">Ahmet Y. (A-1)</span>
                </div>
            </div>
        </header>

        <!-- Compact Filter Bar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <!-- Segment Control: Block Switcher -->
                <div class="segment-control">
                    <button class="segment-btn active" data-block="ALL" data-i18n="allBlocks">Tüm Bloklar</button>
                    <button class="segment-btn" data-block="A" data-i18n="blockA">A Blok</button>
                    <button class="segment-btn" data-block="B" data-i18n="blockB">B Blok</button>
                </div>

                <!-- Status Filter Pills -->
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="ALL"><span data-i18n="allSpots">Tümü</span> (24)</button>
                    <button class="filter-btn" data-filter="AVAILABLE">
                        <span class="filter-indicator ind-available"></span> <span data-i18n="freeNow">Şu An Boş</span> (<span id="countAvailable">--</span>)
                    </button>
                    <button class="filter-btn" data-filter="EV">
                        <i data-lucide="zap" class="btn-icon"></i> <span data-i18n="evChargers">EV Şarj</span> (<span id="countEv">--</span>)
                    </button>
                    <button class="filter-btn" data-filter="VACATION">
                        <span data-i18n="vacationFilter">Tatilde</span> (<span id="countVacation">--</span>)
                    </button>
                </div>
            </div>

            <!-- Legend -->
            <div class="toolbar-right">
                <div class="status-legend">
                    <span class="legend-item"><span class="legend-dot ind-available"></span> <span data-i18n="legendAvailable">Boş</span></span>
                    <span class="legend-item"><span class="legend-dot ind-owner"></span> <span data-i18n="legendOwner">Ev Sahibi</span></span>
                    <span class="legend-item"><span class="legend-dot ind-neighbor"></span> <span data-i18n="legendNeighbor">Komşu</span></span>
                    <span class="legend-item"><span class="legend-dot ind-guest"></span> <span data-i18n="legendGuest">Misafir İzni</span></span>
                </div>
            </div>
        </div>

        <!-- Main Parking Layout -->
        <main class="parking-deck">
            <!-- Block A -->
            <section class="block-section" id="blockASection">
                <div class="section-title">
                    <h2 data-i18n="blockA">A Blok</h2>
                    <span data-i18n="flatsRange">Daireler 1 – 12</span>
                </div>
                <div class="spots-grid" id="blockAGrid"></div>
            </section>

            <!-- Driveway Divider -->
            <div class="driveway-divider" id="drivewayDivider">
                <span data-i18n="drivewayAisle">GİRİŞ & ANA OTOPARK YOLU</span>
            </div>

            <!-- Block B -->
            <section class="block-section" id="blockBSection">
                <div class="section-title">
                    <h2 data-i18n="blockB">B Blok</h2>
                    <span data-i18n="flatsRange">Daireler 1 – 12</span>
                </div>
                <div class="spots-grid" id="blockBGrid"></div>
            </section>
        </main>
    </div>

    <!-- General Modal (Spot Details & Reservation Flow) -->
    <div class="modal-backdrop" id="spotModalBackdrop">
        <div class="modal-card">
            <button class="modal-close-btn" id="closeModalBtn">
                <i data-lucide="x"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Security Gate Modal -->
    <div class="modal-backdrop" id="securityModalBackdrop">
        <div class="modal-card">
            <button class="modal-close-btn" id="closeSecurityModalBtn">
                <i data-lucide="x"></i>
            </button>
            <div style="margin-bottom: 1rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff;" data-i18n="securitySearchTitle">Site Güvenliği Plaka Doğrulama</h3>
                <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.2rem;">Girişteki araç plakasını yazarak anında izin kontrolü yapın.</p>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <input type="text" id="gatePlateInput" placeholder="Örn: 34 GST 789 veya 34 DNZ 102" style="flex:1; padding: 0.55rem 0.85rem; background: #0b0f17; border: 1px solid #232f48; border-radius: 8px; color:#fff; font-family: monospace; text-transform: uppercase;">
                <button class="filter-btn active" style="background:#3b82f6; border:none; color:#fff; font-weight:600;" id="verifyPlateBtn" data-i18n="securityVerifyBtn">İzni Sorgula</button>
            </div>
            <div id="securityVerificationResult"></div>
        </div>
    </div>

    <!-- Active Permits Modal -->
    <div class="modal-backdrop" id="activePermitsModalBackdrop">
        <div class="modal-card" style="max-width: 540px;">
            <button class="modal-close-btn" id="closeActivePermitsModalBtn">
                <i data-lucide="x"></i>
            </button>
            <div style="margin-bottom: 1rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff;" data-i18n="activePermitsTitle">Aktif Rezervasyonlar ve Misafir Kartları</h3>
            </div>
            <div id="activePermitsList" style="max-height: 380px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/parking-grid.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
